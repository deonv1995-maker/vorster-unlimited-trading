<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#35584a">
  <meta name="description" content="Vorster Unlimited Trading mobile business app">
  <link rel="manifest" href="manifest.webmanifest?v=8.7.0">
  <link rel="icon" href="vorster-logo.jpg?v=8.7.0" type="image/jpeg">
  <link rel="stylesheet" href="styles.css?v=8.7.0">
  <link rel="stylesheet" href="inventory.css?v=8.7.0">
  <link rel="stylesheet" href="completion-schedule.css?v=8.7.0">
  <link rel="stylesheet" href="job-card-matching.css?v=8.7.0">
  <link rel="stylesheet" href="production-workflow.css?v=8.7.0">
  <link rel="stylesheet" href="production-checklist-v8.css?v=8.7.0">
  <link rel="stylesheet" href="business-pipeline-v8.css?v=8.7.0">
  <link rel="stylesheet" href="polish-v8.css?v=8.7.0">
  <title>Vorster Unlimited Trading</title>
</head>
<body>
  <div id="splash" class="splash"><img src="vorster-logo.jpg?v=8.7.0" alt="Vorster Unlimited"><div class="splash-name">VORSTER UNLIMITED</div><div class="splash-sub">TRADING</div></div>
  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
      <div class="brand-mini"><img src="vorster-logo.jpg?v=8.7.0" alt=""><div><div class="brand-name">VORSTER UNLIMITED</div><h1 id="pageTitle">Dashboard</h1><small id="runtimeBuild" style="display:block;font-size:10px;opacity:.65">V8.7.0</small></div></div>
      <button id="mergeNativeBtn" class="theme-btn" aria-label="Merge products" title="Merge products">⇄</button><button id="themeBtn" class="theme-btn" aria-label="Switch theme" title="Dark mode">☾</button><button id="installBtn" class="install-btn hidden">Install</button>
    </header>
    <main id="main"></main>
    <nav class="bottom-nav"><button data-route="dashboard" class="active"><span>⌂</span><small>Home</small></button><button data-route="products"><span>▦</span><small>Products</small></button><button data-route="customers"><span>◉</span><small>Customers</small></button><button data-route="visits"><span>⌖</span><small>Predict</small></button><button data-route="quotes"><span>▧</span><small>Quotes</small></button><button data-route="orders"><span>▤</span><small>Orders</small></button></nav>
  </div>
  <dialog id="dialog"></dialog><div id="toast" class="toast hidden"></div>
  <script>
  (async function bootVersion8(){
    const BUILD='8.7.0';
    try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)));}}catch(error){console.warn('Legacy runtime cleanup failed',error);}
    const scripts=['runtime-guard.js','db.js','app.js','inventory.js','raw-stock-v8.js','production-capacity.js','sage-sync.js','job-card-import.js','customer-jobcard-enrichment-v8.js','job-card-matching.js','job-card-matching-fix.js','job-card-connection-review.js','product-aliases.js','product-aliases-fix.js','merge-products.js','merge-native.js','completion-schedule.js','order-line-classification-v8.js','completion-schedule-classification-v8.js','production-workflow.js','workflow-bootstrap-v8.js','production-optimizer-v8.js','production-checklist-v8.js','business-pipeline-v8.js','workflow-predictions-v8.js','pipeline-intelligence-v8.js','production-cross-stage-v8.js','product-search-v8.js','polish-v8.js','daily-work-packs-v8.js'];
    for(const file of scripts){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=file+'?v='+BUILD;script.async=false;script.onload=resolve;script.onerror=()=>reject(new Error('Failed to load '+file));document.body.appendChild(script);});}
    const applyVersion=()=>{document.querySelectorAll('p,strong,span,div').forEach(element=>{if(element.children.length)return;const text=element.textContent||'';if(/1\.0 Alpha 7\.\d+\.\d+|2\.0 Version 8\.\d+\.\d+/.test(text)){element.textContent=text.replace(/1\.0 Alpha 7\.\d+\.\d+|2\.0 Version 8\.\d+\.\d+/,'2.0 Version 8.7.0');}});};
    new MutationObserver(applyVersion).observe(document.documentElement,{childList:true,subtree:true});applyVersion();
  })().catch(error=>{console.error(error);document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#7a2424;color:white;font-family:system-ui">Version 8.7.0 could not load completely. Refresh once while online.</div>');});
  </script>
</body>
</html>
