<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#35584a">
  <meta name="description" content="Vorster Unlimited Trading mobile business app">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="vorster-logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css?v=7.9.2">
  <link rel="stylesheet" href="inventory.css?v=7.9.2">
  <link rel="stylesheet" href="completion-schedule.css?v=7.9.2">
  <link rel="stylesheet" href="job-card-matching.css?v=7.9.2">
  <link rel="stylesheet" href="production-workflow.css?v=7.9.2">
  <title>Vorster Unlimited Trading</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="vorster-logo.jpg" alt="Vorster Unlimited">
    <div class="splash-name">VORSTER UNLIMITED</div>
    <div class="splash-sub">TRADING</div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
      <div class="brand-mini">
        <img src="vorster-logo.jpg" alt="">
        <div>
          <div class="brand-name">VORSTER UNLIMITED</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
      </div>
      <button id="mergeNativeBtn" class="theme-btn" aria-label="Merge products" title="Merge products">⇄</button>
      <button id="themeBtn" class="theme-btn" aria-label="Switch theme" title="Dark mode">☾</button>
      <button id="installBtn" class="install-btn hidden">Install</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button data-route="dashboard" class="active"><span>⌂</span><small>Home</small></button>
      <button data-route="products"><span>▦</span><small>Products</small></button>
      <button data-route="customers"><span>◉</span><small>Customers</small></button>
      <button data-route="visits"><span>⌖</span><small>Predict</small></button>
      <button data-route="quotes"><span>▧</span><small>Quotes</small></button>
      <button data-route="orders"><span>▤</span><small>Orders</small></button>
    </nav>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast hidden"></div>

  <script>
  (async function bootCurrentBuild(){
    const BUILD='7.9.2';
    const resetKey='vu-runtime-reset-'+BUILD;

    if(!sessionStorage.getItem(resetKey)){
      sessionStorage.setItem(resetKey,'1');
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
      }catch(error){console.warn('Service worker cleanup failed',error)}
      try{
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
      }catch(error){console.warn('Cache cleanup failed',error)}
      const nextUrl=new URL(location.href);
      nextUrl.searchParams.set('build',BUILD);
      location.replace(nextUrl.toString());
      return;
    }

    const scripts=[
      'db.js','app.js','inventory.js','production-capacity.js','sage-sync.js',
      'job-card-import.js','job-card-matching.js','job-card-matching-fix.js',
      'job-card-connection-review.js','product-aliases.js','product-aliases-fix.js',
      'merge-products.js','merge-native.js','completion-schedule.js',
      'production-workflow.js','confirmed-production-sync.js'
    ];

    for(const file of scripts){
      await new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src=file+'?v='+BUILD;
        script.onload=resolve;
        script.onerror=()=>reject(new Error('Failed to load '+file));
        document.body.appendChild(script);
      });
    }

    const applyVersion=()=>{
      document.querySelectorAll('p,strong,span,div').forEach(element=>{
        if(element.children.length)return;
        const text=element.textContent||'';
        if(/1\.0 Alpha 7\.\d+\.\d+/.test(text)){
          element.textContent=text.replace(/1\.0 Alpha 7\.\d+\.\d+/,'1.0 Alpha '+BUILD);
        }
      });
    };
    new MutationObserver(applyVersion).observe(document.documentElement,{childList:true,subtree:true});
    applyVersion();

    setTimeout(async()=>{
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
      }catch(error){console.warn('Post-load cache cleanup failed',error)}
    },1200);
  })().catch(error=>{
    console.error(error);
    document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#7a2424;color:white;font-family:system-ui">The latest app files could not load. Refresh once while online.</div>');
  });
  </script>
</body>
</html>
