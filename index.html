<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#35584a">
  <meta name="description" content="Vorster Unlimited Trading mobile business app">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="vorster-logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">
  <title>Vorster Unlimited Trading</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="vorster-logo.jpg" alt="Vorster Unlimited">
    <div class="splash-name">VORSTER UNLIMITED</div>
    <div class="splash-sub">TRADING</div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
      <div class="brand-mini">
        <img src="vorster-logo.jpg" alt="">
        <div>
          <div class="brand-name">VORSTER UNLIMITED</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
      </div>
      <button id="installBtn" class="install-btn hidden">Install</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button data-route="dashboard" class="active"><span>⌂</span><small>Home</small></button>
      <button data-route="products"><span>▦</span><small>Products</small></button>
      <button data-route="customers"><span>◉</span><small>Customers</small></button>
      <button data-route="quotes"><span>▧</span><small>Quotes</small></button>
      <button data-route="orders"><span>▤</span><small>Orders</small></button>
    </nav>
  </div>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
