<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#35584a">
  <meta name="description" content="Vorster Unlimited Trading operations app">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.webmanifest?v=2.0.1">
  <link rel="icon" href="vorster-logo.jpg?v=2.0.1" type="image/jpeg">
  <link rel="stylesheet" href="styles.css?v=2.0.1">
  <link rel="stylesheet" href="inventory.css?v=2.0.1">
  <link rel="stylesheet" href="completion-schedule.css?v=2.0.1">
  <link rel="stylesheet" href="job-card-matching.css?v=2.0.1">
  <link rel="stylesheet" href="unified-core.css?v=2.0.1">
  <title>Vorster Unlimited Trading</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="vorster-logo.jpg?v=2.0.1" alt="Vorster Unlimited">
    <div class="splash-name">VORSTER UNLIMITED</div>
    <div class="splash-sub">TRADING</div>
  </div>
  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">←</button>
      <div class="brand-mini"><img src="vorster-logo.jpg?v=2.0.1" alt=""><div><div class="brand-name">VORSTER UNLIMITED</div><h1 id="pageTitle">Dashboard</h1></div></div>
      <button id="themeBtn" class="theme-btn" aria-label="Switch theme" title="Dark mode">☾</button>
      <button id="installBtn" class="install-btn hidden">Install</button>
    </header>
    <main id="main"></main>
    <nav class="bottom-nav">
      <button data-route="dashboard" class="active"><span>⌂</span><small>Home</small></button>
      <button data-route="products"><span>▦</span><small>Products</small></button>
      <button data-route="customers"><span>◉</span><small>Customers</small></button>
      <button data-route="visits"><span>⌖</span><small>Predict</small></button>
      <button data-route="quotes"><span>▧</span><small>Quotes</small></button>
      <button data-route="orders"><span>▤</span><small>Orders</small></button>
    </nav>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="db.js?v=2.0.1"></script>
  <script src="app.js?v=2.0.1"></script>
  <script src="inventory.js?v=2.0.1"></script>
  <script src="production-capacity.js?v=2.0.1"></script>
  <script src="sage-sync.js?v=2.0.1"></script>
  <script src="job-card-import.js?v=2.0.1"></script>
  <script src="job-card-matching.js?v=2.0.1"></script>
  <script src="job-card-matching-fix.js?v=2.0.1"></script>
  <script src="job-card-connection-review.js?v=2.0.1"></script>
  <script src="product-aliases.js?v=2.0.1"></script>
  <script src="product-aliases-fix.js?v=2.0.1"></script>
  <script src="merge-products.js?v=2.0.1"></script>
  <script src="completion-schedule.js?v=2.0.1"></script>
  <script src="unified-core.js?v=2.0.1"></script>
  <script src="app-update.js?v=2.0.1"></script>
</body>
</html>
